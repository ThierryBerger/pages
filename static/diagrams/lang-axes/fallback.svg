<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 580" width="100%" preserveAspectRatio="xMidYMid meet" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" class="la-svg" role="img" aria-label="Programming languages positioned by control, safety and cost to wield"><g class="la-floor"><line x1="239.37" y1="408.56" x2="562.63" y2="438.9" stroke="var(--la-grid, #e1e0d9)" stroke-width="1" opacity="0.9"/><line x1="239.37" y1="408.56" x2="121.37" y2="491.66" stroke="var(--la-grid, #e1e0d9)" stroke-width="1" opacity="0.9"/><line x1="209.87" y1="429.34" x2="533.13" y2="459.67" stroke="var(--la-grid, #e1e0d9)" stroke-width="1" opacity="0.9"/><line x1="320.18" y1="416.14" x2="202.18" y2="499.25" stroke="var(--la-grid, #e1e0d9)" stroke-width="1" opacity="0.9"/><line x1="180.37" y1="450.11" x2="503.63" y2="480.45" stroke="var(--la-grid, #e1e0d9)" stroke-width="1" opacity="0.9"/><line x1="401" y1="423.73" x2="283" y2="506.83" stroke="var(--la-grid, #e1e0d9)" stroke-width="1" opacity="0.9"/><line x1="150.87" y1="470.89" x2="474.13" y2="501.22" stroke="var(--la-grid, #e1e0d9)" stroke-width="1" opacity="0.9"/><line x1="481.82" y1="431.31" x2="363.82" y2="514.42" stroke="var(--la-grid, #e1e0d9)" stroke-width="1" opacity="0.9"/><line x1="121.37" y1="491.66" x2="444.63" y2="522" stroke="var(--la-grid, #e1e0d9)" stroke-width="1" opacity="0.9"/><line x1="562.63" y1="438.9" x2="444.63" y2="522" stroke="var(--la-grid, #e1e0d9)" stroke-width="1" opacity="0.9"/></g><g class="la-wall"><line x1="239.37" y1="325.42" x2="562.63" y2="355.76" stroke="var(--la-grid, #e1e0d9)" stroke-width="1" opacity="0.9"/><line x1="320.18" y1="416.14" x2="320.18" y2="83.58" stroke="var(--la-grid, #e1e0d9)" stroke-width="1" opacity="0.9"/><line x1="239.37" y1="242.28" x2="562.63" y2="272.62" stroke="var(--la-grid, #e1e0d9)" stroke-width="1" opacity="0.9"/><line x1="401" y1="423.73" x2="401" y2="91.17" stroke="var(--la-grid, #e1e0d9)" stroke-width="1" opacity="0.9"/><line x1="239.37" y1="159.14" x2="562.63" y2="189.48" stroke="var(--la-grid, #e1e0d9)" stroke-width="1" opacity="0.9"/><line x1="481.82" y1="431.31" x2="481.82" y2="98.75" stroke="var(--la-grid, #e1e0d9)" stroke-width="1" opacity="0.9"/><line x1="239.37" y1="76" x2="562.63" y2="106.34" stroke="var(--la-grid, #e1e0d9)" stroke-width="1" opacity="0.9"/><line x1="562.63" y1="438.9" x2="562.63" y2="106.34" stroke="var(--la-grid, #e1e0d9)" stroke-width="1" opacity="0.9"/></g><polygon points="239.37,100.63 538.69,436.65 420.69,519.75 121.37,183.74" fill="var(--la-muted, #898781)" opacity="0.08"/><line x1="121.37" y1="183.74" x2="420.69" y2="519.75" stroke="var(--la-muted, #898781)" stroke-width="1.2" opacity="0.45" stroke-dasharray="4 5"/><line x1="239.37" y1="100.63" x2="538.69" y2="436.65" stroke="var(--la-muted, #898781)" stroke-width="1.6" opacity="0.85" stroke-dasharray="5 4"/><g class="la-axes"><line x1="239.37" y1="408.56" x2="562.63" y2="438.9" stroke="var(--la-axis, #c3c2b7)" stroke-width="1.8" opacity="1"/><line x1="239.37" y1="408.56" x2="239.37" y2="76" stroke="var(--la-axis, #c3c2b7)" stroke-width="1.8" opacity="1"/><line x1="239.37" y1="408.56" x2="121.37" y2="491.66" stroke="var(--la-axis, #c3c2b7)" stroke-width="1.8" opacity="1"/><polygon points="562.63,438.9 553.35,441.46 553.99,434.65" fill="var(--la-axis, #c3c2b7)" opacity="1"/><polygon points="239.37,76 242.79,85 235.95,85" fill="var(--la-axis, #c3c2b7)" opacity="1"/><polygon points="121.37,491.66 126.76,483.69 130.7,489.28" fill="var(--la-axis, #c3c2b7)" opacity="1"/></g><text x="576.63" y="443.9" font-size="12.5" fill="var(--la-ink-2, #52514e)" text-anchor="start" font-weight="600" opacity="1">control</text><text x="239.37" y="64" font-size="12.5" fill="var(--la-ink-2, #52514e)" text-anchor="middle" font-weight="600" opacity="1">safety</text><text x="109.37" y="506.66" font-size="12.5" fill="var(--la-ink-2, #52514e)" text-anchor="end" font-weight="600" opacity="1">cost to wield</text><g class="la-marks"><line x1="237.42" y1="263.13" x2="237.42" y2="417.1" stroke="var(--la-managed, #2a78d6)" stroke-width="1.2" opacity="0.28" stroke-dasharray="3 3"/><ellipse cx="237.42" cy="417.1" rx="4.5" ry="2.2" fill="var(--la-managed, #2a78d6)" opacity="0.35"/><circle cx="237.42" cy="263.13" r="7" fill="var(--la-managed, #2a78d6)" stroke="var(--la-surface, #ffffff)" stroke-width="2"><title>Python: control 0.03, safety 0.50, cost 0.10. Cheapest to start; the type system asks nothing of you and catches nothing for you.</title></circle><text x="249.42" y="267.13" font-size="13" fill="var(--la-ink, #0b0b0b)" text-anchor="start" font-weight="500" opacity="1">Python</text><line x1="252.91" y1="284.34" x2="252.91" y2="422.91" stroke="var(--la-managed, #2a78d6)" stroke-width="1.2" opacity="0.28" stroke-dasharray="3 3"/><ellipse cx="252.91" cy="422.91" rx="4.5" ry="2.2" fill="var(--la-managed, #2a78d6)" opacity="0.35"/><circle cx="252.91" cy="284.34" r="7" fill="var(--la-managed, #2a78d6)" stroke="var(--la-surface, #ffffff)" stroke-width="2"><title>JS: control 0.10, safety 0.45, cost 0.15. Safe from crashes, unsafe from nonsense: no data races because there are no threads to race.</title></circle><text x="264.91" y="288.34" font-size="13" fill="var(--la-ink, #0b0b0b)" text-anchor="start" font-weight="500" opacity="1">JS</text><line x1="352.21" y1="251.83" x2="352.21" y2="436.59" stroke="var(--la-managed, #2a78d6)" stroke-width="1.2" opacity="0.28" stroke-dasharray="3 3"/><ellipse cx="352.21" cy="436.59" rx="4.5" ry="2.2" fill="var(--la-managed, #2a78d6)" opacity="0.35"/><circle cx="352.21" cy="251.83" r="7" fill="var(--la-managed, #2a78d6)" stroke="var(--la-surface, #ffffff)" stroke-width="2"><title>Go: control 0.45, safety 0.60, cost 0.20. Memory safe and famously cheap to learn, but data races are possible and easy to write.</title></circle><text x="364.21" y="255.83" font-size="13" fill="var(--la-ink, #0b0b0b)" text-anchor="start" font-weight="500" opacity="1">Go</text><line x1="311.35" y1="225.93" x2="311.35" y2="441.48" stroke="var(--la-managed, #2a78d6)" stroke-width="1.2" opacity="0.28" stroke-dasharray="3 3"/><ellipse cx="311.35" cy="441.48" rx="4.5" ry="2.2" fill="var(--la-managed, #2a78d6)" opacity="0.35"/><circle cx="311.35" cy="225.93" r="7" fill="var(--la-managed, #2a78d6)" stroke="var(--la-surface, #ffffff)" stroke-width="2"><title>C#: control 0.35, safety 0.70, cost 0.30. More control than its reputation (structs, Span&lt;T&gt;, stackalloc); nullable refs closed a real hole.</title></circle><text x="323.35" y="229.93" font-size="13" fill="var(--la-ink, #0b0b0b)" text-anchor="start" font-weight="500" opacity="1">C#</text><line x1="485.48" y1="431.38" x2="485.48" y2="462.18" stroke="var(--la-manual, #1baf7a)" stroke-width="1.2" opacity="0.28" stroke-dasharray="3 3"/><ellipse cx="485.48" cy="462.18" rx="4.5" ry="2.2" fill="var(--la-manual, #1baf7a)" opacity="0.35"/><circle cx="485.48" cy="431.38" r="7" fill="var(--la-manual, #1baf7a)" stroke="var(--la-surface, #ffffff)" stroke-width="2"><title>C: control 0.95, safety 0.10, cost 0.35. Total control, no guarantees, and UB that invalidates reasoning about the whole program.</title></circle><text x="497.48" y="435.38" font-size="13" fill="var(--la-ink, #0b0b0b)" text-anchor="start" font-weight="500" opacity="1">C</text><line x1="474.55" y1="346.7" x2="474.55" y2="469.87" stroke="var(--la-manual, #1baf7a)" stroke-width="1.2" opacity="0.28" stroke-dasharray="3 3"/><ellipse cx="474.55" cy="469.87" rx="4.5" ry="2.2" fill="var(--la-manual, #1baf7a)" opacity="0.35"/><circle cx="474.55" cy="346.7" r="7" fill="var(--la-manual, #1baf7a)" stroke="var(--la-surface, #ffffff)" stroke-width="2"><title>Zig: control 0.95, safety 0.40, cost 0.45. Runtime safety checks and explicit allocators, but no borrow checker and no data-race protection.</title></circle><text x="486.55" y="350.7" font-size="13" fill="var(--la-ink, #0b0b0b)" text-anchor="start" font-weight="500" opacity="1">Zig</text><line x1="441.78" y1="415.97" x2="441.78" y2="492.96" stroke="var(--la-manual, #1baf7a)" stroke-width="1.2" opacity="0.28" stroke-dasharray="3 3"/><ellipse cx="441.78" cy="492.96" rx="4.5" ry="2.2" fill="var(--la-manual, #1baf7a)" opacity="0.35"/><circle cx="441.78" cy="415.97" r="7" fill="var(--la-manual, #1baf7a)" stroke="var(--la-surface, #ffffff)" stroke-width="2"><title>C++: control 0.95, safety 0.25, cost 0.75. RAII and smart pointers are real gains, but nothing is enforced; the surface area is enormous.</title></circle><text x="453.78" y="419.97" font-size="13" fill="var(--la-ink, #0b0b0b)" text-anchor="start" font-weight="500" opacity="1">C++</text><line x1="421.35" y1="202.87" x2="421.35" y2="495.4" stroke="var(--la-subject, #eb6834)" stroke-width="1.2" opacity="0.28" stroke-dasharray="3 3"/><ellipse cx="421.35" cy="495.4" rx="4.5" ry="2.2" fill="var(--la-subject, #eb6834)" opacity="0.35"/><circle cx="421.35" cy="202.87" r="8.5" fill="var(--la-subject, #eb6834)" stroke="var(--la-surface, #ffffff)" stroke-width="2"><title>Rust: control 0.90, safety 0.95, cost 0.80. Alone in rejecting data races at compile time without a GC. Not 1.0: unsafe exists, and logic bugs remain.</title></circle><text x="433.35" y="206.87" font-size="13" fill="var(--la-ink, #0b0b0b)" text-anchor="start" font-weight="700" opacity="1">Rust</text></g><g class="la-legend"><circle cx="48" cy="558" r="5.5" fill="var(--la-manual, #1baf7a)"/><text x="60" y="562" font-size="12" fill="var(--la-ink-2, #52514e)" text-anchor="start" font-weight="500" opacity="1">manual memory</text><circle cx="169.1" cy="558" r="5.5" fill="var(--la-managed, #2a78d6)"/><text x="181.1" y="562" font-size="12" fill="var(--la-ink-2, #52514e)" text-anchor="start" font-weight="500" opacity="1">garbage collected</text><circle cx="317" cy="558" r="5.5" fill="var(--la-subject, #eb6834)"/><text x="329" y="562" font-size="12" fill="var(--la-ink-2, #52514e)" text-anchor="start" font-weight="500" opacity="1">Rust</text><line x1="377.8" y1="558" x2="395.8" y2="558" stroke="var(--la-muted, #898781)" stroke-width="1.6" opacity="0.9" stroke-dasharray="5 4"/><text x="402.8" y="562" font-size="12" fill="var(--la-ink-2, #52514e)" text-anchor="start" font-weight="500" opacity="1">the trade-off everyone assumes</text></g><g class="la-caption"><text x="48" y="24" font-size="16" fill="var(--la-ink, #0b0b0b)" text-anchor="start" font-weight="700" opacity="1">Three axes</text><text x="48" y="41" font-size="12.5" fill="var(--la-muted, #898781)" text-anchor="start" font-weight="400" opacity="1">and here is what leaving the line costs</text></g></svg>